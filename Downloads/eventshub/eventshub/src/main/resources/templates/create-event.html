<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
    <h2>Create Event</h2>

    <form th:action="@{/admin/create-event}" th:object="${event}" method="post">

        <div class="form-group">
            <label>Title</label>
            <input type="text" th:field="*{title}" title="Event title" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <input type="text" th:field="*{description}" title="Event description" required>
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="text" th:field="*{date}" title="Event date" required>
        </div>

        <button type="submit">Create</button>

    </form>
</div>

</body>
</html>
